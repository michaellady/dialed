name: PR Stale Warning

# Scheduled workflow that comments on PRs whose stacks have been sitting
# idle. No auto-destroy — just a nudge to the author.

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  warn:
    name: Warn on stale PR stacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read idle threshold
        id: cfg
        run: |
          if command -v yq >/dev/null 2>&1; then
            :
          else
            curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
            chmod +x /usr/local/bin/yq
          fi
          days=$(yq -r '.stale_pr_idle_days // 7' .dialed.yml)
          project=$(yq -r '.project_name' .dialed.yml)
          echo "days=${days}" >> "$GITHUB_OUTPUT"
          echo "project=${project}" >> "$GITHUB_OUTPUT"

      - name: Comment on stale PRs
        uses: actions/github-script@v7
        env:
          IDLE_DAYS: ${{ steps.cfg.outputs.days }}
          PROJECT: ${{ steps.cfg.outputs.project }}
        with:
          script: |
            const idleDays = Number(process.env.IDLE_DAYS);
            const cutoff = Date.now() - idleDays * 24 * 60 * 60 * 1000;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const pr of prs) {
              const updatedAt = new Date(pr.updated_at).getTime();
              if (updatedAt >= cutoff) continue;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const alreadyWarned = comments.some(c =>
                c.user.type === 'Bot' &&
                c.body.includes(`DIALED stale-PR warning`) &&
                (Date.now() - new Date(c.created_at).getTime()) < idleDays * 24 * 60 * 60 * 1000
              );
              if (alreadyWarned) continue;
              const body = [
                `### DIALED stale-PR warning`,
                ``,
                `This PR has been open for more than ${idleDays} days. The dev stack for this PR is still running and incurring AWS costs.`,
                ``,
                `**Options:**`,
                `- Push a commit to keep the stack alive (resets the clock).`,
                `- Close the PR — the stack will be torn down automatically by pr-cleanup.`,
                ``,
                `_(This warning is generated by pr-stale-warn.yml in the ${process.env.PROJECT} project.)_`,
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
              console.log(`Commented on stale PR #${pr.number}`);
            }
