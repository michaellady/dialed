name: Main Deploy (3-env)

# Push to main → dev → system tests → staging → system+smoke → prod → smoke
# → release. Fully automated. Staging is the pre-prod gate; if it's red, prod
# doesn't deploy. 3-env variant; 2-env variant omits the staging tier.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize the WHOLE promotion chain per repo: without this, only the apply
# jobs held a lock, so commit B's deploy-dev could overwrite the dev stack
# while commit A's system tests were still running — promoting A to prod
# validated against B's deployment. One run at a time; a newer queued run
# supersedes an older pending one (never a running one).
concurrency:
  group: dialed-main-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  unit-and-integration:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    # environment:dev so this job's OIDC subject is repo:<r>:environment:dev.
    # The narrowed non-prod trust (bootstrap/main.tf) no longer admits the bare
    # ref:refs/heads/main subject a plain push job would otherwise present.
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dialed-setup
        with:
          env: dev
      - name: Build
        if: env.DIALED_BUILD_CMD != ''
        run: eval "$DIALED_BUILD_CMD"
      - name: Unit tests
        if: env.DIALED_TEST_UNIT_CMD != ''
        run: eval "$DIALED_TEST_UNIT_CMD"
      - name: Integration tests
        if: env.DIALED_TEST_INTEGRATION_CMD != ''
        run: eval "$DIALED_TEST_INTEGRATION_CMD"

  deploy-dev:
    name: Deploy to dev
    needs: unit-and-integration
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: dialed-dev
      cancel-in-progress: false
    outputs:
      stack_url: ${{ steps.stack.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dialed-setup
        with:
          env: dev
      - if: env.DIALED_BUILD_CMD != ''
        run: eval "$DIALED_BUILD_CMD"
      - name: Terraform init + apply (stack)
        working-directory: terraform/stack
        run: |
          terraform init \
            -backend-config="bucket=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tfstate" \
            -backend-config="key=stack/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tflocks" \
            -backend-config="encrypt=true"
          terraform workspace select -or-create "${DIALED_WORKSPACE}"
          cp ../../.dialed-cache/dialed.auto.tfvars.json dialed.auto.tfvars.json
          terraform apply -auto-approve -var="environment=dev" -var='pr_number='
      - name: Capture stack URL
        id: stack
        working-directory: terraform/stack
        run: |
          # Distinguish "no stack_url output defined" (legitimate URL-less
          # service → empty) from any OTHER terraform failure (broken backend,
          # bad state), which must fail the job rather than silently emptying
          # the URL and degrading the downstream gates.
          set +e
          url=$(terraform output -raw stack_url 2>/tmp/stack-url.err)
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE 'output "stack_url" not found|no outputs found' /tmp/stack-url.err; then
              url=""
            else
              cat /tmp/stack-url.err >&2
              echo "::error::terraform output failed for a reason other than a missing stack_url output"
              exit 1
            fi
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Wait for readiness
        env:
          STACK_URL: ${{ steps.stack.outputs.url }}
        run: |
          if [ -n "${STACK_URL}" ]; then
            make wait-ready STACK_URL="${STACK_URL}"
          fi

  system-test-dev:
    name: System tests (dev)
    needs: deploy-dev
    runs-on: ubuntu-latest
    # environment:dev — see unit-and-integration; keeps the OIDC subject env-scoped.
    environment: dev
    # No job-level stack_url condition: a skipped gate propagates skip down the
    # whole needs chain (staging, prod, release), so a broken/absent URL would
    # silently stop main from ever reaching prod. The gate ALWAYS runs; the
    # step decides no-op / fail / test.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dialed-setup
        with:
          env: dev
      - name: System tests
        env:
          STACK_URL: ${{ needs.deploy-dev.outputs.stack_url }}
        run: |
          if [ -z "${DIALED_TEST_SYSTEM_CMD:-}" ]; then
            echo "No system-test command configured — gate passes as a no-op."
            exit 0
          fi
          if [ -z "${STACK_URL}" ]; then
            echo "::error::DIALED_TEST_SYSTEM_CMD is configured but deploy-dev produced no stack_url — failing the gate instead of skipping it."
            exit 1
          fi
          eval "$DIALED_TEST_SYSTEM_CMD"

  deploy-staging:
    name: Deploy to staging
    needs: system-test-dev
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: dialed-staging
      cancel-in-progress: false
    outputs:
      stack_url: ${{ steps.stack.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dialed-setup
        with:
          env: staging
      - if: env.DIALED_BUILD_CMD != ''
        run: eval "$DIALED_BUILD_CMD"
      - name: Terraform init + apply (stack)
        working-directory: terraform/stack
        run: |
          terraform init \
            -backend-config="bucket=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tfstate" \
            -backend-config="key=stack/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tflocks" \
            -backend-config="encrypt=true"
          terraform workspace select -or-create "${DIALED_WORKSPACE}"
          cp ../../.dialed-cache/dialed.auto.tfvars.json dialed.auto.tfvars.json
          terraform apply -auto-approve -var="environment=staging" -var='pr_number='
      - name: Capture stack URL
        id: stack
        working-directory: terraform/stack
        run: |
          # Distinguish "no stack_url output defined" (legitimate URL-less
          # service → empty) from any OTHER terraform failure (broken backend,
          # bad state), which must fail the job rather than silently emptying
          # the URL and degrading the downstream gates.
          set +e
          url=$(terraform output -raw stack_url 2>/tmp/stack-url.err)
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE 'output "stack_url" not found|no outputs found' /tmp/stack-url.err; then
              url=""
            else
              cat /tmp/stack-url.err >&2
              echo "::error::terraform output failed for a reason other than a missing stack_url output"
              exit 1
            fi
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Wait for readiness
        env:
          STACK_URL: ${{ steps.stack.outputs.url }}
        run: |
          if [ -n "${STACK_URL}" ]; then
            make wait-ready STACK_URL="${STACK_URL}"
          fi

  system-and-smoke-staging:
    name: System + smoke tests (staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    # environment:staging so this job's OIDC subject is repo:<r>:environment:staging,
    # which the narrowed non-prod trust admits (the bare ref does not).
    environment: staging
    # Always runs (no job-level stack_url condition) — see system-test-dev.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dialed-setup
        with:
          env: staging
      - name: System + smoke tests
        env:
          STACK_URL: ${{ needs.deploy-staging.outputs.stack_url }}
        run: |
          if [ -z "${DIALED_TEST_SYSTEM_CMD:-}" ] && [ -z "${DIALED_TEST_SMOKE_CMD:-}" ]; then
            echo "No system/smoke-test commands configured — gate passes as a no-op."
            exit 0
          fi
          if [ -z "${STACK_URL}" ]; then
            echo "::error::staging tests are configured but deploy-staging produced no stack_url — failing the gate instead of skipping it."
            exit 1
          fi
          if [ -n "${DIALED_TEST_SYSTEM_CMD:-}" ]; then eval "$DIALED_TEST_SYSTEM_CMD"; fi
          if [ -n "${DIALED_TEST_SMOKE_CMD:-}" ]; then eval "$DIALED_TEST_SMOKE_CMD"; fi

  deploy-prod:
    name: Deploy to prod
    needs: system-and-smoke-staging
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: dialed-prod
      cancel-in-progress: false
    outputs:
      stack_url: ${{ steps.stack.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dialed-setup
        with:
          env: prod
      - if: env.DIALED_BUILD_CMD != ''
        run: eval "$DIALED_BUILD_CMD"
      - name: Terraform init + apply (stack)
        working-directory: terraform/stack
        run: |
          terraform init \
            -backend-config="bucket=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tfstate" \
            -backend-config="key=stack/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=dialed-${DIALED_PROJECT_NAME}-${DIALED_ACCOUNT_ID}-tflocks" \
            -backend-config="encrypt=true"
          terraform workspace select -or-create "${DIALED_WORKSPACE}"
          cp ../../.dialed-cache/dialed.auto.tfvars.json dialed.auto.tfvars.json
          terraform apply -auto-approve -var="environment=prod" -var='pr_number='
      - name: Capture stack URL
        id: stack
        working-directory: terraform/stack
        run: |
          # Distinguish "no stack_url output defined" (legitimate URL-less
          # service → empty) from any OTHER terraform failure (broken backend,
          # bad state), which must fail the job rather than silently emptying
          # the URL and degrading the downstream gates.
          set +e
          url=$(terraform output -raw stack_url 2>/tmp/stack-url.err)
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE 'output "stack_url" not found|no outputs found' /tmp/stack-url.err; then
              url=""
            else
              cat /tmp/stack-url.err >&2
              echo "::error::terraform output failed for a reason other than a missing stack_url output"
              exit 1
            fi
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Wait for readiness
        env:
          STACK_URL: ${{ steps.stack.outputs.url }}
        run: |
          if [ -n "${STACK_URL}" ]; then
            make wait-ready STACK_URL="${STACK_URL}"
          fi

  smoke-test-prod:
    name: Smoke tests (prod)
    needs: deploy-prod
    runs-on: ubuntu-latest
    # environment:prod so this job's OIDC subject is repo:<r>:environment:prod.
    # The narrowed prod trust (bootstrap/main.tf) trusts ONLY that subject — the
    # bare ref:refs/heads/main was removed — so this job MUST declare the env.
    environment: prod
    # Always runs (no job-level stack_url condition) — see system-test-dev.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dialed-setup
        with:
          env: prod
      - name: Smoke tests
        env:
          STACK_URL: ${{ needs.deploy-prod.outputs.stack_url }}
        run: |
          if [ -z "${DIALED_TEST_SMOKE_CMD:-}" ]; then
            echo "No smoke-test command configured — gate passes as a no-op."
            exit 0
          fi
          if [ -z "${STACK_URL}" ]; then
            echo "::error::DIALED_TEST_SMOKE_CMD is configured but deploy-prod produced no stack_url — failing the gate instead of skipping it."
            exit 1
          fi
          eval "$DIALED_TEST_SMOKE_CMD"

  # ─── Release: the "prod is live" event ────────────────────────────────────────────────
  #
  # A GitHub Release is created on every SUCCESSFUL prod deploy — never on merge. Merge
  # and deploy diverge exactly when it matters: a merge whose chain fails must never be
  # announced. Release-published is therefore the one event downstream automation
  # (announcements, Slack release subscriptions, changelogs) can trust to mean "serving
  # in prod".
  #
  # Tag scheme: auto-incrementing semver — highest existing vX.Y.Z tag + 1 on patch,
  # starting at v0.0.1 (non-semver tags are ignored). To cut a minor/major, create that
  # release by hand once (plain vX.Y.0 — no -rc/pre-release suffixes, the increment does
  # integer arithmetic on patch) and the auto-increment continues from it. Idempotent: a
  # re-run — or a re-deploy of an unchanged commit — finds a semver tag already pointing
  # at the SHA and skips, so one commit == one version.
  #
  # Body: deterministic base first (the squash commit's message + GitHub's generated PR
  # links), then a best-effort dispatched Claude pass rewrites it for non-technical
  # readers — plain-English title, "## Summary" on top, technical detail collapsed (see
  # release-summary.yml; needs the CLAUDE_CODE_OAUTH_TOKEN secret). The dispatch is
  # continue-on-error — release creation never depends on it, and a red polish step must
  # not repaint a green deploy.
  release:
    name: Release (prod is live)
    needs: [deploy-prod, smoke-test-prod]
    # smoke-test-prod always runs now (no-op when unconfigured), so release
    # requires BOTH green — never after a failure, skip, or cancellation.
    if: ${{ !cancelled() && needs.deploy-prod.result == 'success' && needs.smoke-test-prod.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + release
      actions: write # dispatch the Release Summary workflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semver scan needs all tags; the latest-marker guard needs ancestry
      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_pattern='v[0-9]*.[0-9]*.[0-9]*'
          # Idempotence: one commit == one version. A re-run (or a re-deploy of an
          # unchanged commit) finds its semver tag already on the SHA and skips.
          existing="$(git tag -l "$tag_pattern" --points-at "${{ github.sha }}" | sort -V | tail -1)"
          if [ -n "$existing" ]; then
            echo "commit already released as $existing — nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title="$(git log -1 --pretty=%s)"
          # GitHub's squash-merge normalizes trailer casing to "Co-authored-by" — match
          # case-insensitively (GNU sed /I; runners are Ubuntu), and drop the PR-body footer.
          body="$(git log -1 --pretty=%b | sed '/^co-authored-by:/Id; /Generated with \[Claude Code\]/d')"
          created=""
          for attempt in 1 2 3; do
            latest="$(git tag -l "$tag_pattern" | sort -V | tail -1)"
            IFS=. read -r major minor patch <<<"${latest:-v0.0.0}"
            major="${major#v}"
            tag="v${major}.${minor}.$((patch + 1))"
            # Releasing OLDER code late (a re-run of an old failed run after newer commits
            # already released) must not steal the "latest" marker downstream automation
            # reads: if this commit is an ancestor of the current latest tag's commit, mark
            # the release non-latest.
            latest_flag=""
            if [ -n "$latest" ]; then
              latest_commit="$(git rev-list -n 1 "$latest")"
              if [ "$latest_commit" != "${{ github.sha }}" ] && git merge-base --is-ancestor "${{ github.sha }}" "$latest_commit"; then
                latest_flag="--latest=false"
              fi
            fi
            if printf '## What shipped\n\n%s\n' "$body" | gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "$title" \
              --notes-file - \
              --generate-notes \
              $latest_flag; then
              created="$tag"
              break
            fi
            echo "creating $tag failed (parallel release race, attempt $attempt) — refetching tags"
            git fetch --tags --quiet
          done
          if [ -z "$created" ]; then
            echo "::error::could not create a release after 3 attempts"
            exit 1
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$created" >> "$GITHUB_OUTPUT"
      # claude-code-action@v1 refuses `push` events, so the rewrite runs as a dispatched
      # Release Summary workflow (workflow_dispatch IS supported; GITHUB_TOKEN may create
      # workflow_dispatch events). Best-effort: a failed dispatch never repaints the deploy.
      - name: Dispatch plain-English rewrite (Claude, best-effort)
        if: steps.create.outputs.created == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-summary.yml --ref main -f tag="${{ steps.create.outputs.tag }}"
